# Cyber Onda 2 · #34 Trivy + #28 npm audit
name: Security scan

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Toda segunda 09:00 UTC

jobs:
  npm-audit:
    name: npm audit (Node deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit (HIGH+ critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan FS · vulns + secrets + misconfig
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          scanners: 'vuln,secret,misconfig'
          ignore-unfixed: true

  trivy-image:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chat-bullq-api:scan .
      - name: Trivy scan image · vulns
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'chat-bullq-api:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
